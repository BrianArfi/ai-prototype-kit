<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Prototype Kit animated hero</title>
<!-- Rendered to docs/hero.gif by render_gifs.py (1600x800, 9 s loop).
     Same layout as hero.html. before.png / after.png are real screenshots of examples/coffee-order.html
     (before: Dina's real pinned comment; after: the page once a real /revise-from-comments run made Large
     the default). The dark card quotes the report row that run printed. The motion is an illustration. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F1F3EE;--field:#0D453E;--ink:#072B27;--signal:#C8F751;
        --sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:800px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);position:relative}
  .a{animation-duration:.55s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-iteration-count:1}
  @keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  @keyframes slideL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes type{from{width:0}to{width:23ch}}
  @keyframes pulse{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(2.4)}}

  .copy{position:absolute;left:72px;top:210px;width:540px}
  .kicker{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--field);margin-bottom:28px;display:inline-flex;align-items:center;gap:12px}
  .kicker i{width:14px;height:14px;border-radius:3px;background:var(--signal);border:3px solid var(--ink)}
  h1{font-size:64px;line-height:1.05;font-weight:900;letter-spacing:-.035em;white-space:nowrap}
  h1 > span{display:inline-block}
  .hl{position:relative;z-index:0}
  .hl i{position:absolute;left:-6px;right:-6px;bottom:4px;height:24px;background:var(--signal);z-index:-1;border-radius:4px;transform-origin:left}
  .link{margin-top:48px;display:inline-flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:16px;
    padding:16px 22px;font-family:var(--mono);font-size:19px;font-weight:500;white-space:nowrap;box-shadow:6px 6px 0 var(--ink)}
  .same{margin-top:22px;font-size:28px;font-weight:700;color:var(--field)}

  .phone{position:absolute;top:118px;width:300px;height:600px;border-radius:38px;overflow:hidden;box-shadow:0 30px 60px rgba(7,43,39,.22)}
  .phone img{width:300px;display:block}
  .before{left:600px}.after{left:1240px}
  .tag{position:absolute;top:70px;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--field);background:#fff;border:2px solid var(--field);border-radius:999px;padding:5px 14px}
  .tag.v1{left:600px}
  .tag.v2{left:1240px;background:var(--signal);border-color:var(--ink);color:var(--ink)}
  .ping{position:absolute;left:864px;top:327px;width:28px;height:28px;border-radius:50%;border:4px solid var(--signal);box-shadow:0 0 0 2px var(--ink)}

  .card{position:absolute;left:926px;top:262px;width:268px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px 18px;box-shadow:6px 6px 0 var(--ink);transform-origin:left center}
  .card .who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}
  .card .av{width:32px;height:32px;border-radius:50%;background:var(--field);color:#fff;display:grid;place-items:center;font-size:16px}
  .card .pin{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--field);font-weight:700}
  .card p{margin-top:10px;font-size:23px;line-height:1.25;font-weight:500}
  .leader{position:absolute;left:900px;top:336px;width:26px;height:3px;background:var(--ink);transform-origin:left}

  .ai{position:absolute;left:926px;top:455px;width:268px;background:var(--ink);color:#E8EDE6;border-radius:18px;padding:16px 16px 18px;
    font-family:var(--mono);font-size:17px;line-height:1.55;box-shadow:0 18px 40px rgba(7,43,39,.25)}
  .ai .chip{display:inline-block;background:var(--signal);color:var(--ink);font-family:var(--sans);font-weight:900;font-size:22px;border-radius:10px;padding:4px 12px;margin-bottom:10px}
  .ai .cmd{display:block;overflow:hidden;white-space:nowrap}
  .ai .ok{color:var(--signal);font-weight:700}
  .arrow{position:absolute;left:1198px;top:540px}
  .ring{position:absolute;left:1429px;top:340px;width:93px;height:49px;border:5px solid var(--signal);border-radius:14px;box-shadow:0 0 0 3px var(--ink)}
  .ring2{position:absolute;left:1258px;top:645px;width:264px;height:50px;border:5px solid var(--signal);border-radius:16px;box-shadow:0 0 0 3px var(--ink)}
  .cover{position:absolute;inset:0;background:var(--paper);z-index:9}
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker a" style="animation-name:fade;animation-delay:.1s"><i></i>ai-prototype-kit</div>
    <h1><span class="a" style="animation-name:up;animation-delay:.25s">Comment on&nbsp;it.</span><br><span class="hl a" style="animation-name:up;animation-delay:3.2s"><i class="a" style="animation-name:grow;animation-delay:3.6s;animation-duration:.5s"></i>AI revises it.</span></h1>
    <div><div class="link a" style="animation-name:up;animation-delay:6.3s">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0D453E" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      your-project.pages.dev/coffee-order
    </div></div>
    <div class="same a" style="animation-name:up;animation-delay:6.7s">Same link, every version.</div>
  </div>

  <div class="tag v1 a" style="animation-name:fade;animation-delay:.6s">v1 &middot; reviewed</div>
  <div class="phone before a" style="animation-name:slideL;animation-delay:.5s;animation-duration:.7s"><img src="before.png" alt=""></div>
  <div class="ping a" style="animation-name:pulse;animation-delay:1.3s;animation-duration:.9s;animation-timing-function:ease-out"></div>
  <div class="leader a" style="animation-name:grow;animation-delay:1.8s;animation-duration:.3s"></div>
  <div class="card a" style="animation-name:pop;animation-delay:2.0s">
    <div class="who"><span class="av">D</span>Dina<span class="pin">on Large</span></div>
    <p>Default to Large, most people pick it</p>
  </div>

  <div class="ai a" style="animation-name:up;animation-delay:3.7s">
    <span class="chip">AI revised</span>
    <span class="cmd a" style="animation-name:type;animation-delay:4.1s;animation-duration:.9s;animation-timing-function:steps(23)">&gt; /revise-from-comments</span>
    <span class="a" style="display:block;animation-name:fade;animation-delay:5.0s">1 | Dina | <span class="ok">Done</span>: Large is now selected by default</span>
  </div>
  <svg class="arrow a" style="animation-name:slideL;animation-delay:5.4s;animation-duration:.4s" width="40" height="40" viewBox="0 0 40 40"><path d="M4 20h28M22 9l11 11-11 11" fill="none" stroke="#072B27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div class="tag v2 a" style="animation-name:pop;animation-delay:5.9s">v2 &middot; same link</div>
  <div class="phone after a" style="animation-name:slideR;animation-delay:5.5s;animation-duration:.7s"><img src="after.png" alt=""></div>
  <div class="ring a" style="animation-name:pop;animation-delay:6.0s"></div>
  <div class="ring2 a" style="animation-name:pop;animation-delay:6.2s"></div>
  <div class="cover a" style="animation-name:fade;animation-delay:8.5s;animation-duration:.5s;animation-timing-function:linear"></div>
</body>
</html>
