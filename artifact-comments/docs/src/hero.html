<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>artifact-comments hero</title>
<!-- Rendered to docs/hero.png at 1600x800, 2x, by docs/src/render.py. shot.png is a real screenshot of the client. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F1F3EE;--field:#0D453E;--ink:#072B27;--signal:#C8F751}
  *{box-sizing:border-box;margin:0}
  html,body{width:1600px;height:800px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:Archivo,"Segoe UI",system-ui,sans-serif;position:relative}
  .left{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
  .tag{font:700 22px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;color:var(--field);display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .tag i{width:14px;height:14px;border-radius:3px;background:var(--signal);border:3px solid var(--ink);box-sizing:content-box}
  h1{font-weight:800;font-size:56px;line-height:1.04;letter-spacing:-.03em;white-space:nowrap}
  h1 .hl{background:linear-gradient(transparent 58%,var(--signal) 58%,var(--signal) 92%,transparent 92%);padding:0 4px;margin:0 -4px}
  .sub{margin-top:24px;font:500 23px/1.4 Archivo,sans-serif;color:var(--field);max-width:440px}
  .cmd{margin-top:30px;display:inline-flex;align-self:flex-start;align-items:center;gap:14px;background:var(--ink);color:#E6EDE3;border-radius:12px;padding:15px 20px;font:500 17px/1 "JetBrains Mono",ui-monospace,Consolas,monospace}
  .cmd b{color:var(--signal);font-weight:500}
  .win{position:absolute;right:56px;top:96px;width:940px;border:3px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;box-shadow:18px 18px 0 var(--field)}
  .bar{height:44px;background:var(--ink);display:flex;align-items:center;gap:9px;padding:0 18px}
  .bar span{width:12px;height:12px;border-radius:50%;background:#2c5a53}
  .bar .url{margin-left:18px;flex:1;height:26px;border-radius:7px;background:#123c37;color:#a9c3bd;font:500 14px/26px "JetBrains Mono",ui-monospace,monospace;padding:0 12px}
  .win img{display:block;width:100%}
</style>
</head>
<body>
  <div class="left">
    <div class="tag"><i></i>artifact-comments</div>
    <h1>Feedback,<br>pinned to <span class="hl">the&nbsp;spot.</span></h1>
    <p class="sub">Readers click any part of your HTML page and comment right there. Everyone sees the thread.</p>
    <div class="cmd"><b>$</b> node server/node/server.mjs</div>
  </div>
  <div class="win">
    <div class="bar"><span></span><span></span><span></span><div class="url">127.0.0.1:8787/onboarding</div></div>
    <img src="shot.png" alt="">
  </div>
</body>
</html>
